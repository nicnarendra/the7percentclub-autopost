name: Post due videos

on:
  schedule:
    # 08:30 IST and 19:30 IST (GitHub cron is in UTC and can start a few minutes late)
    - cron: "0 3 * * *"
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "post | check | dry-run | seo | scopes"
        default: "post"

permissions:
  contents: write

concurrency:
  group: autopost
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Post
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          MODE="${{ github.event.inputs.mode || 'post' }}"
          case "$MODE" in
            check) python scripts/post.py --check ;;
            dry-run) python scripts/post.py --dry-run ;;
            scopes) python scripts/seo.py --scopes ;;
            seo) python scripts/seo.py ;;
            *) python scripts/post.py; S=$?; python scripts/seo.py --videos || true; exit $S ;;
          esac
      - name: Save results
        if: always()
        run: |
          git config user.name "7club-autopost"
          git config user.email "actions@users.noreply.github.com"
          git add queue config
          git diff --cached --quiet || (git commit -m "Record posting results" && git push)
