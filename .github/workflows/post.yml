name: Post due videos

on:
  schedule:
    # 08:30 IST and 19:30 IST (GitHub cron is in UTC and can start a few minutes late)
    - cron: "0 3 * * *"
    - cron: "0 14 * * *"
    # Backup runs: GitHub often starts scheduled runs late or skips them under load.
    # A backup run posts only what is due and not yet posted, so nothing doubles.
    - cron: "12 3 * * *"
    - cron: "27 3 * * *"
    - cron: "12 14 * * *"
    - cron: "27 14 * * *"
    - cron: "42 7 * * *"
    - cron: "12 20 * * *"
    - cron: "12 0 * * *"
    # 13:00 IST: Instagram carousels
    - cron: "30 7 * * *"
    # US channel: 3 PM ET long-form (20:00 UTC) and 7 PM ET Short (00:00 UTC)
    - cron: "0 20 * * *"
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        options: [post, check, dry-run, seo, scopes, analytics]
        default: post
      channel:
        description: "Which channel"
        type: choice
        options: [both, in, us]
        default: both

permissions:
  contents: write

concurrency:
  group: autopost
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Post - The 7% Club (India)
        if: ${{ github.event.inputs.channel != 'us' }}
        env:
          CHANNEL: in
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: bash scripts/run.sh "${{ github.event.inputs.mode || 'post' }}"
      - name: Post - The Boring Rich Club (US)
        if: ${{ always() && github.event.inputs.channel != 'in' }}
        env:
          CHANNEL: us
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN_US: ${{ secrets.YT_REFRESH_TOKEN_US }}
        run: bash scripts/run.sh "${{ github.event.inputs.mode || 'post' }}"
      - name: Save results
        if: always()
        run: |
          git config user.name "7club-autopost"
          git config user.email "actions@users.noreply.github.com"
          git add queue config channels status
          git diff --cached --quiet || (git commit -m "Record posting results" && git push)
