name: Post due videos

on:
  schedule:
    # GitHub often starts scheduled runs late or skips them, so every slot is retried
    # every 10 minutes for 2 hours. A run posts only what is due and not yet posted,
    # so nothing goes out twice; runs with nothing due exit quietly.
    # India 08:30 IST Short (03:00 UTC)
    - cron: "*/10 3-4 * * *"
    # India 13:00 IST Instagram carousel (07:30 UTC)
    - cron: "30,40,50 7 * * *"
    - cron: "*/10 8 * * *"
    # India 19:30 IST Short (14:00 UTC)
    - cron: "*/10 14-15 * * *"
    # US 3 PM ET long-form (20:00 UTC)
    - cron: "*/10 20-21 * * *"
    # US 7 PM ET Short (00:00 UTC)
    - cron: "*/10 0-1 * * *"
    # Safety sweep every 3 hours for anything still missed
    - cron: "45 */3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        options: [post, check, dry-run, seo, scopes, analytics]
        default: post
      channel:
        description: "Which channel"
        type: choice
        options: [both, in, us]
        default: both

permissions:
  contents: write

concurrency:
  group: autopost
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Post - The 7% Club (India)
        if: ${{ github.event.inputs.channel != 'us' }}
        env:
          CHANNEL: in
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: bash scripts/run.sh "${{ github.event.inputs.mode || 'post' }}"
      - name: Post - The Boring Rich Club (US)
        if: ${{ always() && github.event.inputs.channel != 'in' }}
        env:
          CHANNEL: us
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN_US: ${{ secrets.YT_REFRESH_TOKEN_US }}
        run: bash scripts/run.sh "${{ github.event.inputs.mode || 'post' }}"
      - name: Save results
        if: always()
        run: |
          git config user.name "7club-autopost"
          git config user.email "actions@users.noreply.github.com"
          git add queue config channels status
          git diff --cached --quiet || (git commit -m "Record posting results" && git push)
