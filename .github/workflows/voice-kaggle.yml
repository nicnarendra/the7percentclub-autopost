name: Voice test on Kaggle GPU

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: voice-kaggle
  cancel-in-progress: false

jobs:
  kaggle:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          pip install -q kaggle
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Push the job to Kaggle (private, GPU, internet)
        run: |
          U=$(echo "$KAGGLE_USERNAME" | tr -d '[:space:]')
          cat > voice-kaggle/kernel/kernel-metadata.json <<JSON
          {"id": "$U/seven-club-voice-test", "title": "seven-club-voice-test", "code_file": "run.py",
           "language": "python", "kernel_type": "script", "is_private": true,
           "enable_gpu": true, "enable_internet": true, "machine_shape": "NvidiaTeslaT4",
           "dataset_sources": [], "competition_sources": [], "kernel_sources": []}
          JSON
          kaggle kernels push -p voice-kaggle/kernel
          echo "KID=$U/seven-club-voice-test" >> $GITHUB_ENV
      - name: Wait for Kaggle to finish
        run: |
          for i in $(seq 1 100); do
            s=$(kaggle kernels status "$KID" 2>&1 | tail -1); echo "$(date -u +%T) $s"
            case "$s" in *COMPLETE*|*complete*) exit 0;; *ERROR*|*error*|*CANCEL*) exit 0;; esac
            sleep 60
          done
      - name: Download and convert
        if: always()
        run: |
          mkdir -p voice-kaggle/out && kaggle kernels output "$KID" -p voice-kaggle/out || true
          cd voice-kaggle/out && ls -la
          for f in *.wav; do [ -f "$f" ] || continue
            ffmpeg -loglevel error -y -i "$f" -af loudnorm=I=-14:TP=-1.5 -ar 44100 -b:a 160k "${f%.wav}.mp3" && rm "$f"; done
          rm -f *.log 2>/dev/null; ls -la
      - name: Commit results
        if: always()
        run: |
          git config user.name "7club-autopost"
          git config user.email "actions@users.noreply.github.com"
          git add -f voice-kaggle/out || true
          git diff --cached --quiet && exit 0
          git commit -m "Kaggle voice test results"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
